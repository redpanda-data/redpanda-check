name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLUGIN_UPLOAD_ROLE_ARN }}
          aws-region: us-west-2

      - name: Upload managed plugin
        uses: ./.github/actions/upload_managed_plugin
        with:
          aws_region: us-west-2
          aws_s3_bucket: rpk-plugins-repo
          artifacts_file: ${{ github.workspace }}/target/dist/artifacts.json
          metadata_file: ${{ github.workspace }}/target/dist/metadata.json
          project_root_dir: ${{ github.workspace }}
          plugin_name: check
          goos: linux,darwin
          goarch: amd64,arm64
          repo_hostname: rpk-plugins.redpanda.com
          dry_run: "false"

      # Regenerate the rpk check plugin docs in redpanda-data/docs. The docs
      # workflow (update-rpk-plugin-docs.yml) refreshes only the check
      # subtree of its rpk command snapshot and opens a PR per eligible docs
      # branch. Re-assumes the org-standard role because the plugin-upload
      # role above has no Secrets Manager access.
      # Best-effort docs notification: the release artifacts are already
      # published above, so a failure in the docs dispatch chain must not
      # mark the release run as failed.
      - name: Configure AWS credentials for Secrets Manager
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}
      - name: Fetch actions bot token
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true
      - name: Trigger rpk check plugin docs update in redpanda-data/docs
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ env.ACTIONS_BOT_TOKEN }}
          repository: redpanda-data/docs
          event-type: update-rpk-plugin-docs
          client-payload: '{"plugin": "check", "version": "${{ github.ref_name }}"}'
